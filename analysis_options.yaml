# analysis_options.yaml — Agent-Friendly Strict Mode
# 에이전트가 표준화된 코드를 작성하도록 강제하는 엄격한 린트 설정

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # 에러 수준으로 격상
    missing_return: error
    dead_code: warning
    unused_import: warning
    unused_local_variable: warning
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # ── 코드 품질 ──────────────────────────────────
    avoid_print: true                    # debugPrint() 사용 강제
    always_declare_return_types: true    # 반환 타입 명시 강제
    require_trailing_commas: true        # trailing comma 강제 (diff 가독성)
    prefer_const_constructors: true      # const 생성자 선호
    prefer_const_literals_to_create_immutables: true
    prefer_final_locals: true            # 재할당 없는 변수는 final
    prefer_single_quotes: true           # 단따옴표 통일

    # ── 안전성 ────────────────────────────────────
    avoid_dynamic_calls: true            # dynamic 타입 메서드 호출 금지
    avoid_type_to_string: true
    cancel_subscriptions: true           # StreamSubscription cancel 강제
    close_sinks: true                    # Sink close 강제

    # ── Flutter 아키텍처 ──────────────────────────
    use_build_context_synchronously: true # async gap 후 BuildContext 사용 경고

    # ── 네이밍 ────────────────────────────────────
    file_names: true                     # 파일명 snake_case 강제
    non_constant_identifier_names: true

    # ── 문서화 ────────────────────────────────────
    comment_references: true

    # ── 비활성화 ──────────────────────────────────
    # (필요 시 false로 비활성화)
    # lines_longer_than_80_chars: false
